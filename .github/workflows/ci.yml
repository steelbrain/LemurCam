name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash -eo pipefail instead of the default bash -e.
    shell: bash

env:
  # Pinned tool versions, installed from the projects' own release archives
  # rather than Homebrew's current formula, so a tool release cannot change
  # CI results without a commit. SWIFTLINT_VERSION must equal
  # swiftlint_version in .swiftlint.yml.
  SWIFTLINT_VERSION: 0.65.1
  XCODEGEN_VERSION: 2.46.0

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        uses: ./.github/actions/install-swiftlint
        with:
          version: ${{ env.SWIFTLINT_VERSION }}

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  xcode-build:
    name: Xcode Build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Use the macos-26 image's default Xcode (26.x), matching the dev toolchain.
      # Pinning an older Xcode pulled in an SDK that lacked Sendable annotations on
      # Dispatch/CoreImage types, which broke the Swift 6 build.
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          dir="$RUNNER_TEMP/xcodegen"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$dir/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$dir/xcodegen.zip" -d "$dir"
          # The archive keeps bin/ next to share/xcodegen (its setting
          # presets), so run the binary in place.
          bin="$(find "$dir" -type f -path '*/bin/xcodegen' | head -n 1)"
          if [ -z "$bin" ]; then
            echo "::error::No bin/xcodegen in xcodegen.zip"
            exit 1
          fi
          chmod +x "$bin"
          installed="$("$bin" --version)"
          if [ "$installed" != "Version: $XCODEGEN_VERSION" ]; then
            echo "::error::Expected XcodeGen $XCODEGEN_VERSION, got $installed"
            exit 1
          fi
          dirname "$bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        uses: ./.github/actions/install-swiftlint
        with:
          version: ${{ env.SWIFTLINT_VERSION }}

      # CI runners have no signing certificates or provisioning profiles. The app's
      # entitlements (system extension, app group) otherwise demand a profile, so
      # disable code signing — the linker still ad-hoc signs the binaries on arm64,
      # which is enough to launch the test host and run the unit tests.
      #
      # The unused-import check (swiftlint analyze) reads each Swift file's
      # compiler arguments from this build's log, and a build logs only the files
      # it compiles, so it starts clean, as scripts/ci.sh does, even though a new
      # runner has nothing built.
      - name: Build LemurCam for testing
        run: >-
          xcodebuild clean build-for-testing -scheme LemurCam -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Check for unused imports
        run: >-
          scripts/check-unused-imports.sh "$RUNNER_TEMP/xcodebuild.log"
          --reporter github-actions-logging

      - name: Test LemurCam
        run: >-
          xcodebuild test-without-building -scheme LemurCam -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
